# Runs every documented verify command on Linux, Windows and macOS, with only the two stated dependencies.
# A sample documented to pass must exit 0; a tampered sample must exit 1.
name: verify-samples
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pqcrypto: ["pqcrypto==0.4.0", "pqcrypto"]  # the version the pack was built with, and the latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cryptography "${{ matrix.pqcrypto }}"
      - name: documented commands
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -u
          fail=0
          check() {  # check <dir> <expected exit> <trail> <witness> <keys>
            got=0; ( cd "$1" && python verify.py "$3" "$4" "$5" > /dev/null ) || got=$?
            if [ "$got" -eq "$2" ]; then echo "ok   $1/$3 (exit $got)"; else echo "FAIL $1/$3 (exit $got, expected $2)"; fail=1; fi
          }
          check . 0 samples/normal_trail.json samples/normal_witness.json samples/authority_public_key.txt
          check . 1 samples/tampered_modify_observation_value.json samples/normal_witness.json samples/authority_public_key.txt
          check . 1 samples/tampered_full_rewrite_with_new_checkpoints.json samples/normal_witness.json samples/authority_public_key.txt
          check . 1 samples/tampered_replay_authorization.json samples/normal_witness.json samples/authority_public_key.txt
          check . 0 samples/partition_trail.json samples/partition_witness.json samples/authority_public_key.txt
          check . 0 samples/stolen_key_trail.json samples/stolen_key_witness.json samples/authority_public_key.txt
          check v2 0 samples/hybrid_trail.json samples/hybrid_witness.json samples/hybrid_authority_keys.json
          check v2 1 samples/hybrid_quantum_forgery_appended_now.json samples/hybrid_witness.json samples/hybrid_authority_keys.json
          check v2 0 samples/classic_quantum_forgery_appended_now.json samples/classic_witness.json samples/classic_authority_keys.json
          check oversight 0 samples/plant_trail.json samples/plant_witness.json samples/signer_keys.json
          check oversight 1 samples/tampered_insider_automatic_outside_policy.json samples/plant_witness.json samples/signer_keys.json
          check oversight 0 samples/rogue_engine_trail.json samples/rogue_engine_witness.json samples/rogue_engine_signer_keys.json
          check vehicle-forensics 0 samples/ota_incident_trail.json samples/ota_incident_witness.json samples/signer_keys.json
          check vehicle-forensics 1 samples/edited_after_incident_trail.json samples/edited_after_incident_witness.json samples/edited_after_incident_signer_keys.json
          check self-adaptive-robot 0 samples/cell_trail.json samples/cell_witness.json samples/signer_keys.json
          check self-adaptive-robot 1 samples/tampered_claims_another_twin_version.json samples/cell_witness.json samples/signer_keys.json
          check self-adaptive-robot 1 samples/tampered_insider_automatic_outside_policy.json samples/cell_witness.json samples/signer_keys.json
          check self-adaptive-robot 0 samples/rogue_manager_trail.json samples/rogue_manager_witness.json samples/rogue_manager_signer_keys.json
          check self-adaptive-robot 0 samples/sim_to_real_gap_trail.json samples/sim_to_real_gap_witness.json samples/sim_to_real_gap_signer_keys.json
          check key-revocation 0 samples/revocation_trail.json samples/revocation_witness.json samples/signer_keys.json
          check key-revocation 1 samples/tampered_revoked_key_written_directly.json samples/tampered_revoked_key_witness.json samples/signer_keys.json
          check key-revocation 1 samples/tampered_old_key_after_rotation.json samples/tampered_old_key_witness.json samples/signer_keys.json
          check key-revocation 1 samples/tampered_thief_rotation.json samples/tampered_thief_rotation_witness.json samples/signer_keys.json
          check key-revocation 1 samples/tampered_revocation_deleted.json samples/revocation_witness.json samples/signer_keys.json
          # verifier 3.2 must judge every v2-format sample of the other folders exactly as their own verifier does
          V32="$PWD/key-revocation/verify.py"
          for line in "v2 samples/hybrid_trail.json samples/hybrid_witness.json samples/hybrid_authority_keys.json"                       "v2 samples/hybrid_quantum_forgery_appended_now.json samples/hybrid_witness.json samples/hybrid_authority_keys.json"                       "oversight samples/plant_trail.json samples/plant_witness.json samples/signer_keys.json"                       "oversight samples/tampered_insider_automatic_outside_policy.json samples/plant_witness.json samples/signer_keys.json"                       "vehicle-forensics samples/ota_incident_trail.json samples/ota_incident_witness.json samples/signer_keys.json"                       "vehicle-forensics samples/edited_after_incident_trail.json samples/edited_after_incident_witness.json samples/edited_after_incident_signer_keys.json"                       "self-adaptive-robot samples/cell_trail.json samples/cell_witness.json samples/signer_keys.json"                       "self-adaptive-robot samples/tampered_claims_another_twin_version.json samples/cell_witness.json samples/signer_keys.json"; do
            set -- $line
            a=0; ( cd "$1" && python verify.py "$2" "$3" "$4" > /dev/null ) || a=$?
            b=0; ( cd "$1" && python "$V32" "$2" "$3" "$4" > /dev/null ) || b=$?
            if [ "$a" -eq "$b" ]; then echo "same $1/$2 (exit $a)"; else echo "DIFF $1/$2 ($a vs $b)"; fail=1; fi
          done
          # tezos-anchor-check, offline: it must reproduce the anchored roots of this pack from SHA256SUMS
          [ "$(python tezos-anchor-check/tezos_anchor_check.py sums SHA256SUMS.txt | tr -d '\r')" = "048d5cc133e37d262027a7dbf686af43a84819ad4a3a94c01a3e83c54a16fc44" ] && echo "ok   anchor-check: pack root" || { echo "FAIL anchor-check: pack root"; fail=1; }
          [ "$(python tezos-anchor-check/tezos_anchor_check.py sums key-revocation/SHA256SUMS.txt | tr -d '\r')" = "99f50ed2354f023319e1f057dd463f6447f657e3a7fcf1bc5bf36ed215edb874" ] && echo "ok   anchor-check: key-revocation root" || { echo "FAIL anchor-check: key-revocation root"; fail=1; }
          exit $fail
